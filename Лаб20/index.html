<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Форма подписки Coffee Market</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #ffffff;
  }

  .subscription-section {
    background-color: #f0f2f5;
    padding: 60px 20px;
    text-align: center;
  }

  .subscription-container {
    max-width: 600px;
    margin: 0 auto;
  }

  .subscription-title {
    font-size: 24px;
    font-weight: 700;
    color: #333333;
    margin-bottom: 15px;
    text-transform: uppercase;
    line-height: 1.3;
  }

  .subscription-subtitle {
    font-size: 14px;
    color: #555555;
    margin-bottom: 30px;
    line-height: 1.5;
  }

  .subscription-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 400px;
    margin: 0 auto;
  }

  .form-input {
    width: 100%;
    padding: 14px 20px;
    margin-bottom: 15px;
    border: 1px solid #d1d1d1;
    border-radius: 25px;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.3s;
    cursor: pointer;
  }

  .form-input:focus {
    border-color: #1ca3e3;
  }

  .select-wrapper {
    position: relative;
    width: 100%;
    margin-bottom: 20px;
  }

  .form-select {
    width: 100%;
    padding: 14px 20px;
    border: 1px solid #d1d1d1;
    border-radius: 25px;
    font-size: 14px;
    background-color: #ffffff;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    outline: none;
    cursor: pointer;
    color: #333;
    background-image: url('images/arrow-down.png');
    background-repeat: no-repeat;
    background-position: right 20px center;
    background-size: 16px;
  }

  .checkbox-group {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 25px;
    width: 100%;
  }

  .custom-checkbox {
    display: flex;
    align-items: center;
    font-size: 14px;
    color: #333333;
    cursor: pointer;
    user-select: none;
  }

  .custom-checkbox input {
    position: absolute;
    opacity: 0;
    cursor: pointer;
    height: 0;
    width: 0;
  }

  .checkmark {
    height: 20px;
    width: 20px;
    display: inline-block;
    margin-right: 8px;
    background-image: url('images/checkbox-empty.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }

  .custom-checkbox input:checked ~ .checkmark {
    background-image: url('images/checkbox-checked.png');
  }

  .submit-btn {
    width: 100%;
    padding: 15px 20px;
    background-color: #1ca3e3;
    color: #ffffff;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  .submit-btn:hover {
    background-color: #158bc2;
  }

  @media (max-width: 480px) {
    .checkbox-group {
      flex-direction: column;
      align-items: flex-start;
      padding-left: 20px;
    }
  }
</style>
</head>
<body>

<section class="subscription-section">
  <div class="subscription-container">
    <h2 class="subscription-title">Подпишитесь и получайте<br>новости первым</h2>
    <p class="subscription-subtitle">В рассылке мы сообщаем о наших акциях и специальных предложениях. Вы можете получать эту информацию из первых рук.</p>
    
    <form class="subscription-form" action="#" method="POST">
      <input type="text" class="form-input" placeholder="Введите ваше имя" required>
      <input type="email" class="form-input" placeholder="Введите email" required>
      
      <div class="select-wrapper">
        <select class="form-select" name="frequency">
          <option value="weekly">Раз в неделю</option>
          <option value="monthly">Раз в месяц</option>
        </select>
      </div>
      
      <div class="checkbox-group">
        <label class="custom-checkbox">
          <input type="checkbox" name="topics" value="promo" checked>
          <span class="checkmark"></span>
          Акции и скидки
        </label>
        <label class="custom-checkbox">
          <input type="checkbox" name="topics" value="blog">
          <span class="checkmark"></span>
          Новые статьи в блоге
        </label>
      </div>
      
      <button type="submit" class="submit-btn">Подписаться</button>
    </form>
  </div>
</section>

</body>
</html>
